<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juntix</title>
<meta name="theme-color" content="#2556F5">
<meta name="description" content="Completa el equipo y juega sin que el partido se caiga.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Juntix: una columna de teléfono. Azul = acción, naranja = cupos libres, marino = encabezado de partido. */
:root {
  --blue: #2556F5; --blue-d: #1A44CC; --navy: #13294F; --orange: #F08A2C; --orange-soft: #FDF0E2; --orange-ink: #A8560E;
  --sky: #E3EFFF; --ink: #101B33; --muted: #66728A; --line: #E3E7F0; --bg: #F6F7FB; --card: #FFFFFF; --red: #C62A3A; --red-soft: #FDECEE;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #E8EBF4; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid rgba(37, 86, 245, .45); outline-offset: 2px; }
.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { max-width: 440px; min-height: 100%; margin: 0 auto; background: var(--bg); position: relative; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(19, 41, 79, .08); }
.screen { display: flex; flex-direction: column; flex: 1; min-height: 100dvh; }
.pad { padding: 0 20px; }
.top { display: flex; align-items: center; gap: 12px; padding: 16px 20px 0; min-height: 64px; }
.top h2 { flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 600; padding-right: 44px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; }
h1 { font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; margin: 24px 0 6px; text-wrap: balance; }
.sub { margin: 0 0 20px; color: var(--muted); }
.brand { display: flex; align-items: center; margin: 56px 20px 0; }
.brand svg { height: 52px; width: auto; }

/* formularios */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .lbl { font-size: 14px; font-weight: 600; }
.inp { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; height: 52px; color: var(--muted); }
.inp:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 86, 245, .15); }
.inp.bad { border-color: var(--red); }
.inp input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); height: 100%; }
.inp input::placeholder { color: #9AA4B8; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.errmsg { font-size: 13px; color: var(--red); margin: 0; font-weight: 500; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.inp input[type=date], .inp input[type=time] { min-width: 0; font-size: 15px; }
.check { display: flex; gap: 12px; align-items: flex-start; margin: 6px 0 12px; font-size: 15px; cursor: pointer; }
.check input { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; flex: none; border-radius: 8px; border: 2px solid #B8C2D6; background: #fff; display: grid; place-items: center; margin: 0; cursor: pointer; }
.check input:checked { background: var(--blue); border-color: var(--blue); }
.check input:checked::after { content: ''; width: 12px; height: 7px; border: 3px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.check.bad input { border-color: var(--red); }
.stepper { display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; height: 52px; padding: 0 8px; }
.stepper b { flex: 1; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.stepper button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--sky); color: var(--blue); font-weight: 800; font-size: 20px; line-height: 1; }
.stepper button:disabled { opacity: .4; cursor: default; }

/* botones */
.foot { margin-top: auto; position: sticky; bottom: 0; background: #FAFBFE; border-top: 1px solid var(--line); padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; align-items: center; z-index: 5; }
.btn { width: 100%; height: 52px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--blue-d); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.orange { background: var(--orange); color: #3A1D03; } .btn.orange:hover { background: #E27B1C; }
.btn.red { background: #fff; color: var(--red); border: 1.5px solid #E7A2AA; } .btn.red:hover { background: var(--red-soft); }
.btn.ghost { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); } .btn.ghost:hover { background: var(--sky); }
.linkbtn { border: 0; background: none; padding: 4px; color: var(--blue); font-weight: 700; }
.small { font-size: 14px; color: var(--muted); margin: 0; text-align: center; }

/* chips y puntos */
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip.warn { background: var(--orange-soft); color: var(--orange-ink); }
.chip.info { background: var(--sky); color: var(--blue); }
.chip.solid { background: var(--blue); color: #fff; }
.chip.dash { background: #fff; color: var(--ink); border: 1.5px dashed #8893AA; }
.chip.tag { background: rgba(255, 255, 255, .14); color: #fff; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--blue); }
.dot.off { background: transparent; border: 1.6px dashed var(--orange); }
.dots.tight { gap: 4px; } .dots.tight .dot { width: 9px; height: 9px; }

/* listado */
.head { display: flex; align-items: flex-start; justify-content: space-between; padding: 22px 20px 0; }
.loc { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.head h1 { margin: 2px 0 0; font-size: 26px; }
.logo-sm { width: 44px; height: 44px; }
.filters { display: flex; gap: 8px; padding: 16px 20px 4px; overflow-x: auto; scrollbar-width: none; }
.filters button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 15px; white-space: nowrap; }
.filters button[aria-pressed="true"] { border-color: var(--blue); background: var(--sky); color: var(--blue); }
.list { display: flex; flex-direction: column; gap: 12px; padding: 12px 20px 120px; }
.card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(19, 41, 79, .08), 0 4px 16px rgba(19, 41, 79, .04); display: flex; flex-direction: column; gap: 8px; text-align: left; border: 0; width: 100%; }
.card:hover { box-shadow: 0 2px 6px rgba(19, 41, 79, .12), 0 6px 20px rgba(19, 41, 79, .06); }
.card .r1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.card .r3 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
.count { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 48px 24px; }
.empty h3 { color: var(--ink); margin: 0 0 6px; font-size: 18px; }
.nav { position: sticky; bottom: 0; margin-top: auto; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); z-index: 6; }
.nav a, .nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 4px; }
.nav .on { color: var(--blue); }
.nav .fab { width: 58px; height: 58px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; margin: -30px auto 2px; box-shadow: 0 6px 16px rgba(37, 86, 245, .45); }
.nav .fabw { align-items: center; color: var(--muted); }

/* detalle */
.hero { background: var(--navy); color: #fff; padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.hero .bar { display: flex; justify-content: space-between; margin-bottom: 44px; }
.hero .round { background: rgba(255, 255, 255, .12); border-color: transparent; color: #fff; }
.hero .tags { display: flex; gap: 8px; flex-wrap: wrap; }
.hero h1 { margin: 4px 0 2px; font-size: 30px; }
.hero .meta { color: #C9D3E8; }
.sect { padding: 20px 20px 0; }
.sect .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sect h2 { margin: 0; font-size: 19px; font-weight: 700; }
.people { background: #fff; border-radius: 16px; padding: 4px 16px; box-shadow: 0 1px 3px rgba(19, 41, 79, .08); }
.person { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.person:last-child { border-bottom: 0; }
.av { width: 42px; height: 42px; border-radius: 50%; background: var(--sky); color: var(--blue); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.person.me .av { background: var(--blue); color: #fff; }
.person b { display: block; font-size: 16px; }
.person span { font-size: 14px; color: var(--muted); }
.person .tu { margin-left: auto; }
.banner { margin: 16px 20px 0; border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.banner.ok { background: var(--blue); color: #fff; }
.banner.ok b { display: block; font-size: 17px; }
.banner.ok span { font-size: 14px; opacity: .92; }
.banner.note { background: var(--sky); color: #1B3A78; }
.queue { margin: 16px 20px 0; background: #fff; border: 1.5px solid var(--blue); border-radius: 18px; padding: 18px; text-align: center; }
.queue .t { font-size: 14px; color: var(--muted); }
.queue .big { font-size: 56px; font-weight: 800; line-height: 1.1; color: var(--blue); letter-spacing: -.03em; }
.queue .pos { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
.queue .pos i { font-style: normal; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #EEF0F6; color: var(--muted); }
.queue .pos i.me { background: var(--blue); color: #fff; }
.buy { display: flex; align-items: center; gap: 16px; width: 100%; }
.buy .q { font-size: 14px; color: var(--muted); }
.buy .q b { display: block; font-size: 28px; color: var(--ink); line-height: 1.05; }
.buy .btn { flex: 1; }
.pad-b { height: 24px; }

/* avisos */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 110px; width: min(400px, calc(100% - 32px)); background: #1E2230; color: #fff; border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; z-index: 50; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
.toast .tick { width: 28px; height: 28px; border-radius: 50%; background: var(--orange); color: #1E2230; display: grid; place-items: center; flex: none; }
.toast.err .tick { background: #F27C88; }
.toast b { display: block; font-size: 16px; } .toast span { font-size: 14px; color: #C7CEDF; }
.scrim { position: fixed; inset: 0; background: rgba(16, 27, 51, .55); display: grid; place-items: end center; z-index: 60; }
.modal { background: #fff; width: min(440px, 100%); border-radius: 20px 20px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 85dvh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { margin: 0; font-size: 20px; }
.modal p, .modal li { margin: 0; color: #36415C; font-size: 15px; }
.modal ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.demo { margin: 12px 20px 0; padding: 10px 12px; border-radius: 12px; background: var(--orange-soft); color: var(--orange-ink); font-size: 13.5px; font-weight: 500; }
.me-card { display: flex; gap: 14px; align-items: center; margin: 20px 20px 0; background: #fff; border-radius: 16px; padding: 16px; }
.me-card .av { width: 56px; height: 56px; font-size: 18px; background: var(--blue); color: #fff; }
.me-card b { font-size: 18px; display: block; } .me-card span { color: var(--muted); font-size: 14px; display: block; }
.mini { display: flex; flex-direction: column; gap: 8px; }
.mini .card { padding: 12px 14px; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
.mini .card h3 { font-size: 16px; }
.loading { display: grid; place-items: center; min-height: 40dvh; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; padding: 0 20px; margin-top: 20px; }
@media (prefers-reduced-motion: no-preference) { .toast, .modal { animation: rise .22s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } } .modal { animation-name: slide; } @keyframes slide { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } } }

.word { font-weight: 800; font-size: 46px; letter-spacing: -.045em; margin-left: 10px; color: var(--ink); line-height: 1; }
.dl { position: relative; }
.dl::after { content: ''; position: absolute; width: .15em; height: .15em; border-radius: 50%; background: var(--orange); left: 50%; top: .06em; transform: translateX(-50%); }
.logo-lg { width: 56px; height: 56px; }
.nav.desk { display: none; }

/* ---------- escritorio (≥ 900px): el celular no cambia ---------- */
@media (min-width: 900px) {
  body { background: #EDF0F7; }
  #app { max-width: none; box-shadow: none; }

  /* pantallas con menú (partidos, perfil): barra lateral + contenido */
  .screen:has(> .nav) { display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-auto-rows: max-content; align-content: start; }
  .screen:has(> .nav) > * { grid-column: 2; }
  .screen:has(> .nav) > .nav {
    grid-column: 1; grid-row: 1 / span 20; position: sticky; top: 0; height: 100dvh; margin: 0;
    display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 28px 16px; border-top: 0; border-right: 1px solid var(--line);
  }
  .nav a { flex-direction: row; gap: 12px; font-size: 15px; padding: 12px 14px; border-radius: 12px; }
  .nav a:hover { background: var(--bg); }
  .nav a.on { background: var(--sky); }
  .nav .fabw { order: 3; margin-top: 12px; background: var(--blue); color: #fff; justify-content: center; }
  .nav .fabw:hover { background: var(--blue-d); }
  .nav .fab { width: 24px; height: 24px; margin: 0; background: none; box-shadow: none; }

  .head { padding: 36px 40px 0; }
  .head h1 { font-size: 32px; }
  .filters { padding: 20px 40px 4px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 16px 40px 48px; align-items: stretch; }
  .card .r3 { margin-top: auto; }
  .list .empty { grid-column: 1 / -1; }
  .demo { margin: 14px 40px 0; }
  .me-card, .banner { margin-left: 40px; margin-right: 40px; max-width: 640px; }
  .sect { padding: 28px 40px 0; max-width: 720px; }
  .stack { padding: 0 40px 40px; max-width: 520px; }
  .mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

  /* crear partido y detalle: mismo menú lateral, contenido a lo ancho */
  .screen:has(> .nav) .top { padding: 32px 40px 0; }
  .screen:has(> .nav) .top h2 { text-align: left; padding-right: 0; font-size: 18px; }
  .screen:has(> .nav) > .pad { padding: 0 40px; max-width: 720px; }
  .screen:has(> .nav) > .foot { align-items: flex-start; padding: 16px 40px; }
  .screen:has(> .nav) > .foot .btn { max-width: 360px; }
  .screen:has(> .nav) > .foot .buy { max-width: 520px; }
  .hero { padding: 28px 40px 32px; }
  .hero .bar { margin-bottom: 28px; }
  .hero h1 { font-size: 36px; }
  .queue { margin: 16px 40px 0; max-width: 480px; }
  .pad-b { height: 40px; }

  /* ingreso y registro: tarjeta centrada sobre fondo de marca */
  body:has(#f-login), body:has(#f-reg) { background: linear-gradient(135deg, #13294F 0%, #1A44CC 55%, #2556F5 100%); background-attachment: fixed; }
  #app:has(> #f-login), #app:has(> #f-reg) { background: transparent; box-shadow: none; justify-content: center; min-height: 100dvh; }
  #f-login, #f-reg { width: min(460px, calc(100% - 48px)); margin: 40px auto; min-height: 0; background: #fff; border-radius: 24px; overflow: clip; box-shadow: 0 24px 70px rgba(7, 16, 40, .4); }
  #f-login .foot, #f-reg .foot { position: static; background: var(--bg); }
  .brand { margin-top: 36px; }

  .toast { bottom: 32px; }
  .scrim { place-items: center; }
  .modal { border-radius: 20px; width: min(480px, calc(100% - 48px)); }
}
</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="loading">Cargando Juntix…</div></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
